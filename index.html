<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoscope</title>
    <style>
        html, body { width: 100%; height: 100%; background-color: #181818; }

        .capsule {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-color: #898b79;
            width: 620px;
            height: 420px;
            border: 2px solid #a3a090;
            border-radius: 12px;
            cursor: grab;
        }

        iframe {
            outline: none;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="capsule" style="top: 100px; left: 200px">
        <iframe src="editor/" style="width: 600px; height: 400px;"></iframe>
    </div>

    <div class="capsule" style="top: 300px; left: 700px">
        <iframe src="http://127.0.0.1:8080/pages/game/" style="width: 600px; height: 400px;"></iframe>
    </div>
    

    <div class="capsule" style="top: 500px; left: 500px">
        <iframe src="https://gojs.net/latest/projects/gojs-floorplanner/" style="width: 600px; height: 400px;"></iframe>
    </div>
    

    <script>
        const capsules = document.querySelectorAll('.capsule');
        let activeCapsule = null;
        let offsetX = 0;
        let offsetY = 0;

        capsules.forEach((capsule) => {
            capsule.addEventListener('mousedown', (e) => {
                // Only initiate drag if click is on the capsule itself, not the iframe
                if (e.target.closest('iframe')) {
                    return;
                }

                activeCapsule = capsule;
                offsetX = e.clientX - capsule.offsetLeft;
                offsetY = e.clientY - capsule.offsetTop;
                capsule.style.cursor = 'grabbing';
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (!activeCapsule) return;
            activeCapsule.style.left = (e.clientX - offsetX) + 'px';
            activeCapsule.style.top = (e.clientY - offsetY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (!activeCapsule) return;
            activeCapsule.style.cursor = 'grab';
            activeCapsule = null;
        });
    </script>
</body>
</html>
