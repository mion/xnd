<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta property="og:title" content="App" />
		<meta property="og:description" content="Single-page application." />
		<meta property="og:image" content="https://placehold.it" />
		<title>Editor</title>
		<style>


* { box-sizing: border-box; }

html,
body,
#root {
	width: 100%;
	height: 100%;
	padding: 0;
	margin: 0;
	background: #000;
	color: #FFF;
	font-family: sans-serif;
}

body {
	overflow: hidden;
	overscroll-behavior: none;
}

textarea { 
	font-size: 16px;
	line-height: 1.5;
	font-family: 'JetBrains Mono', monospace;
	background-color: #080808;
	color: #EFD;
	outline: 1px solid transparent;
	border: 1px solid #111;
}

textarea:focus {
	transition: all 750ms ease-in-out;
	outline: 1px solid #222;
	/* border: 1px solid #222;	 */
}

textarea:active {
	outline: 1px solid #222;
	/* border: 1px solid #222; */
	color: #FFF;
	transition: all 750ms ease-in-out;
}

		</style>
	</head>
	<body>
		<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.js"></script>
		<script src="https://unpkg.com/react@17/umd/react.development.js"></script>
		<script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.js"></script>
		<div id="root"></div>
		<script type="text/jsx">


const { useState } = React;
const load = (key, value) => _.defaultTo(localStorage.getItem(key), value);
const save = (key, value) => localStorage.setItem(key, value);

function App() {
  const [value, setValue] = useState(load("data.value", ""));
  const onChange = (event) => {
    const text = event.target.value;
    setValue(text);
    save("data.value", text);
  };
  const rows = value.split("\n").length + 1;
  return (
    <main
      style={{
        display: "flex",
        flexDirection: "column",
        gap: "1rem",
        padding: "1rem",
      }}
    >
    	<div>
    		<h1>Text Editor</h1>
    		<p>Saves and loads from <code>localStorage</code> automatically. The <code>textarea</code> also resizes automatically.</p>
    	</div>
      <div style={{ width: "100%" }}>
        <textarea
        	 style={{
        	 	width: "100%",
        	 	padding: "1rem",
        	 	fontSize: "0.75rem",
        	 	resize: "none"
        	 }}
        	 id="editor"
          spellCheck="false"
          onChange={(e) => onChange(e)}
          value={value}
          rows={rows}
        ></textarea>
      </div>
    </main>
  );
}

const root = document.getElementById("root");
ReactDOM.render(<App />, root);


		</script>
	</body>
</html>
